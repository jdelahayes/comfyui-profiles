[project]
name = "comfyui-profiles"
description = "Usage profiles for ComfyUI: install, check and uninstall from the sidebar the models, custom nodes, workflows and pip packages of a use case, described in a profiles.json."
version = "0.13.0"
requires-python = ">=3.10"
license = { file = "LICENSE" }
# huggingface_hub: downloads from Hugging Face (already there with ComfyUI).
# pyzipper (encrypted Drive zips) is installed on demand.
dependencies = ["huggingface_hub"]

[project.urls]
Repository = "https://github.com/jdelahayes/comfyui-profiles"

# Comfy Registry (https://registry.comfy.org): PublisherId is the id of the publisher created on
# the registry.
[tool.comfy]
PublisherId = "jdelahayes"
DisplayName = "comfyui-profiles"
Icon = ""
