# Publishes the pyproject.toml version to the Comfy Registry. Manual only: needs a publisher on
# https://registry.comfy.org and its token in the REGISTRY_ACCESS_TOKEN secret.
name: Publish to Comfy registry

on:
  workflow_dispatch:

jobs:
  publish-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
