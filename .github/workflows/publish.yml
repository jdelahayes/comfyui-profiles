# Publie la version de pyproject.toml sur le Comfy Registry. Manuel uniquement : nécessite un
# publisher sur https://registry.comfy.org et son token dans le secret REGISTRY_ACCESS_TOKEN.
name: Publish to Comfy registry

on:
  workflow_dispatch:

jobs:
  publish-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
